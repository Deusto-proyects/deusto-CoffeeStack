plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
    id 'io.gatling.gradle' version '3.9.5.6'
}

group = 'com.deusto'
version = '0.0.1-SNAPSHOT'

defaultTasks 'test'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    performanceTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    performanceTestImplementation.extendsFrom testImplementation
    performanceTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'

    gatlingImplementation 'io.gatling.highcharts:gatling-charts-highcharts:3.9.5'
}

// Tests unitarios: src/test/java, patrón *Test.java
tasks.named('test') {
    useJUnitPlatform()
}

// Tests de integración: src/integrationTest/java, patrón *IT.java
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (*IT.java).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}

// Tests de rendimiento: src/performanceTest/java, patrón *PerfTest.java
tasks.register('performanceTest', Test) {
    description = 'Runs performance tests (*PerfTest.java).'
    group = 'verification'
    testClassesDirs = sourceSets.performanceTest.output.classesDirs
    classpath = sourceSets.performanceTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter integrationTest
}

// 'check' encadena unitarios + integración. Rendimiento queda fuera (es pesado, se lanza a mano).
check.dependsOn integrationTest

// Javadoc con configuración tolerante (sin fallar por warnings de doclint), UTF-8 y
// salida en build/docs/javadoc — la usa el workflow de GitHub Pages.
javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docTitle = 'CoffeeStack API'
    options.windowTitle = 'CoffeeStack API'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

// JaCoCo: cobertura tras los tests unitarios
jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/config/SecurityConfig.class',
                '**/CoffeeStackApplication.class'
            ])
        }))
    }
    reports {
        xml.required = true
        html.required = true
    }
}
check.dependsOn jacocoTestReport
