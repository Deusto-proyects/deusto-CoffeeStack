plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
    id 'io.gatling.gradle' version '3.9.5.6'
}

group = 'com.deusto'
version = '0.0.1-SNAPSHOT'

defaultTasks 'test'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'

    gatlingImplementation 'io.gatling.highcharts:gatling-charts-highcharts:3.9.5'
}

tasks.named('test') {
    useJUnitPlatform()
    // Excluir tests de integración de la tarea test normal
    exclude '**/*IT.class'
}

// Tarea dedicada para tests de integración
task integrationTest(type: Test) {
    useJUnitPlatform()
    // Incluir solo los tests de integración
    include '**/*IT.class'
    
    // Ejecutar después de los unitarios
    shouldRunAfter test
}

// Hacer que ./gradlew build o check también lance los de integración
check.dependsOn integrationTest

// JaCoCo: generar informe de cobertura tras los tests
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
check.dependsOn jacocoTestReport


