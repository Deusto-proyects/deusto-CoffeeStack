name: CoffeeStack CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-backend:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build and run all tests with Gradle
      # 'build' incluye 'check' = test + integrationTest + jacocoTestReport.
      # FlywayVendorParityTest valida que las migraciones MySQL y PostgreSQL no divergen.
      run: ./gradlew build

  build-frontend:
    name: Build Frontend (React / Vite)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm install
      
    - name: Build the React project
      working-directory: ./frontend
      # Esto asegura que no haya errores de compilación en el código de React
      run: npm run build
